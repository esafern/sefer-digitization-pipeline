<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yad Malachi — Correction Review</title>
<link rel="stylesheet" href="/app.css?v=20">
</head>
<body>

  <div id="nav-pane">
    <!-- The index pane's own header bar. MOVED here 2026-09-01 (reviewer: "index
         pane has title above blue header - should be inside blue header - should
         be very similar look to scan pane"): the title first shipped inside
         #nav-filter, which is white, so it sat ABOVE the pane's dark controls
         instead of in a header - and its own text colour was near-white, which
         on that background was very nearly invisible. It now shares
         `.pane-header` with #scan-header, so the two panes are the same object
         at the same height. -->
    <!-- NO TITLE HERE. Reviewer, 2026-09-02: "remove more titles from the top
         bar. just show one in hebrew and one in eng in the center pane." The
         four-slot order put the work's name at both ends of every bar - six
         repetitions of one fact across the top of one window. The centre pane
         carries the pair; the outer two carry only their own reference. -->
    <div id="nav-header" class="pane-header">
      <span class="ph-mid">
        <span class="ph-ref ph-he" id="nav-ref-he"></span>
        <span class="ph-ref ph-en" id="nav-ref-en"></span>
      </span>
      <!-- Pinned to the right edge and OUT of the flow: a control sitting in the
           row would push the centred reference off-centre by half its width, and
           only in this one pane. Reviewer: "don't put click word on link up
           there on the index pane, hide it away somewhere - settings icon?" -->
      <button id="settings-btn" type="button" title="Settings" aria-expanded="false">&#9881;</button>
    </div>
    <div id="settings-popover" hidden>
      <label><input type="checkbox" id="filter-copy-link" checked> Copy word link on click</label>
      <p class="settings-hint">Clicking a word in the text puts its URL on the clipboard.</p>
    </div>

    <div id="nav-filter">
      <!-- ONE ROW: part selector + both filters. Reviewer: "part dropdown creates
           asymmetry any suggestions?" - it was a full-width block spanning the
           index pane while the other two panes had nothing at that height, which
           is what read as lopsided. Shrunk to its content and folded into the
           filter row, it stops being a band across the pane AND gives the list
           back a row, which was the other standing ask ("max real estate for the
           index"). The labels shorten to "Part 1 … Part 3 / All" because the klal
           ranges are already the first and last rows of the list underneath. -->
      <div id="nav-toggles">
        <select id="part-select" title="Which part of the corpus to list">
          <option value="1" selected>Part 1</option>
          <option value="2">Part 2</option>
          <option value="3">Part 3</option>
          <option value="all">All parts</option>
        </select>
        <label title="Show only klalim flagged for revisit"><input type="checkbox" id="filter-flagged"> Flagged</label>
        <label title="Show only high-value items"><input type="checkbox" id="filter-high-value"> High-value</label>
      </div>
    </div>
    <div id="nav-list"></div>
    <div id="legend"></div>
  </div>

  <div id="text-pane">
    <!-- ADDED 2026-09-01 (reviewer: "maybe sacrifice a line at top to add header
         that just says something like page text"). The middle pane was the only
         one of the three without a bar, which is what made the other two read as
         heavy - and its reference (which klal you are reading) earns the line on
         its own. Same four slots as the other two. -->
    <!-- ONE centred group, all four slots inside it. Reviewer 2026-09-02:
         "center the header in each pane. move the titles a bit closer to the
         center". The titles used to bookend the bar at its far edges with the
         reference stranded between them, so the pane read as three islands; now
         they sit together and the group centres as a unit. -->
    <div id="text-header" class="pane-header">
      <span class="ph-mid">
        <span class="ph-title ph-he" data-slot="title-he"></span>
        <span class="ph-ref ph-he" id="text-ref-he"></span>
        <span class="ph-ref ph-en" id="text-ref-en"></span>
        <span class="ph-title ph-en" data-slot="title-en"></span>
      </span>
    </div>
    <div id="text-scroll"></div>
  </div>

  <div id="scan-pane">
    <!-- Reviewer, 2026-09-01: "scan pane heb title w.s. heb klal page w.s eng
         klal page w.s. eng title ... both headers same size and shape". That
         order is now the template all three panes follow:
             [Hebrew title] [Hebrew reference] [English reference] [English title]
         NOTE the ids: #klal-indicator holds the HEBREW reference and
         #page-indicator the ENGLISH one. They were named before either carried
         both halves, and both names are load-bearing in app.js and in the tests,
         so the names stayed and only the ORDER moved. -->
    <div id="scan-header" class="pane-header">
      <span class="ph-mid">
        <span class="ph-ref ph-he" id="klal-indicator"></span>
        <span class="ph-ref ph-en" id="page-indicator">Page —</span>
      </span>
    </div>
    <!-- The overlay controls are siblings of #scan-viewer, NOT children of it.
         #scan-viewer is the element that SCROLLS, and an absolutely-positioned
         child of a scroll container is positioned against the scrolled content,
         so both of these slid away with the page: measured at 300% zoom, the
         zoom cluster and both arrows sat at negative y - completely gone - once
         the scan was scrolled past the top. #scan-pane is position:relative and
         does not scroll, so anchoring here pins them to the pane. -->
    <span id="zoom-controls">
      <button id="zoom-out" title="Zoom out">−</button>
      <span id="zoom-level">100%</span>
      <button id="zoom-in" title="Zoom in">+</button>
    </span>
    <button id="page-nav-prev" class="page-nav-btn" title="Previous page">&#8250;</button>
    <button id="page-nav-next" class="page-nav-btn" title="Next page">&#8249;</button>

    <div id="scan-viewer">
      <div id="page-container">
        <img id="page-img" src="">
        <div id="hl-container"></div>
      </div>
    </div>
  </div>

  <div id="tooltip"></div>

  <div id="overlay-backdrop"></div>

  <div id="disputed-panel" class="side-panel">
    <div class="panel-head">
      <span class="panel-title">Disputed word decision</span>
      <button class="panel-close" id="disputed-panel-close">&times;</button>
    </div>
    <div class="panel-body" id="disputed-panel-body"></div>
  </div>

  <div id="klal-flag-panel" class="side-panel">
    <div class="panel-head">
      <span class="panel-title">Flag klal for revisit</span>
      <button class="panel-close" id="klal-flag-panel-close">&times;</button>
    </div>
    <div class="panel-body" id="klal-flag-panel-body"></div>
  </div>

  <div id="punctuation-panel" class="side-panel">
    <div class="panel-head">
      <span class="panel-title">Proposed punctuation</span>
      <button class="panel-close" id="punctuation-panel-close">&times;</button>
    </div>
    <div class="panel-body" id="punctuation-panel-body"></div>
  </div>

  <div id="witness-panel" class="side-panel">
    <div class="panel-head">
      <span class="panel-title">Witness disagreement</span>
      <button class="panel-close" id="witness-panel-close">&times;</button>
    </div>
    <div class="panel-body" id="witness-panel-body"></div>
  </div>

  <!-- ADDED 2026-09-01 (reviewer: "clicking on a flag count at the bottom of the
       index panel should pop up a list of those flags as clickable links").
       A .side-panel like the other five, so backdrop-click and Escape dismiss it
       through the machinery that already exists. -->
  <div id="flag-list-panel" class="side-panel">
    <div class="panel-head">
      <span class="panel-title" id="flag-list-panel-title">Flagged words</span>
      <button class="panel-close" id="flag-list-panel-close">&times;</button>
    </div>
    <div class="panel-body" id="flag-list-panel-body"></div>
  </div>

  <div id="manual-panel" class="side-panel">
    <div class="panel-head">
      <span class="panel-title">Flag / correct word</span>
      <button class="panel-close" id="manual-panel-close">&times;</button>
    </div>
    <div class="panel-body" id="manual-panel-body"></div>
  </div>

  <div id="title-panel" class="side-panel">
    <div class="panel-head">
      <span class="panel-title">Correct the heading</span>
      <button class="panel-close" id="title-panel-close">&times;</button>
    </div>
    <div class="panel-body" id="title-panel-body"></div>
  </div>

  <script src="/app.js?v=15"></script>
</body>
</html>
