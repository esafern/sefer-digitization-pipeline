<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yad Malachi — Correction Review</title>
<link rel="stylesheet" href="/app.css?v=6">
</head>
<body>

  <div id="nav-pane">
    <div id="nav-filter">
      <select id="part-select" style="width: 100%; margin-bottom: 8px; padding: 4px 8px; border-radius: 4px; font-weight: bold; background: #2d3748; color: #edf2f7; border: 1px solid #4a5568; cursor: pointer;">
        <option value="1" selected>Part 1 (Klalim 1 – 222)</option>
        <option value="2">Part 2 (Klalim 223 – 444)</option>
        <option value="3">Part 3 (Klalim 445 – 667)</option>
        <option value="all">All Parts (Klalim 1 – 667)</option>
      </select>
      <label style="display:block;margin-bottom:4px;"><input type="checkbox" id="filter-flagged"> Flagged for revisit only</label>
      <label style="display:block;"><input type="checkbox" id="filter-high-value"> High-value items only</label>
    </div>
    <div id="nav-list"></div>
    <div id="legend"></div>
  </div>

  <div id="text-pane">
    <div id="text-scroll"></div>
  </div>

  <div id="scan-pane">
    <div id="scan-header">
      <span><span id="page-indicator">Page —</span> <span id="klal-indicator"></span></span>
      <span id="zoom-controls">
        <button id="zoom-out" title="Zoom out">−</button>
        <span id="zoom-level">100%</span>
        <button id="zoom-in" title="Zoom in">+</button>
      </span>
    </div>
    <div id="scan-viewer">
      <button id="page-nav-prev" class="page-nav-btn" title="Previous page">&#8250;</button>
      <button id="page-nav-next" class="page-nav-btn" title="Next page">&#8249;</button>
      <div id="page-container">
        <img id="page-img" src="">
        <div id="hl-container"></div>
      </div>
    </div>
  </div>

  <div id="tooltip"></div>

  <div id="overlay-backdrop"></div>

  <div id="candidate-panel" class="side-panel">
    <div class="panel-head">
      <span class="panel-title">Word decision</span>
      <button class="panel-close" id="candidate-panel-close">&times;</button>
    </div>
    <div class="panel-body" id="candidate-panel-body"></div>
  </div>

  <div id="klal-flag-panel" class="side-panel">
    <div class="panel-head">
      <span class="panel-title">Flag klal for revisit</span>
      <button class="panel-close" id="klal-flag-panel-close">&times;</button>
    </div>
    <div class="panel-body" id="klal-flag-panel-body"></div>
  </div>

  <div id="punctuation-panel" class="side-panel">
    <div class="panel-head">
      <span class="panel-title">Proposed punctuation</span>
      <button class="panel-close" id="punctuation-panel-close">&times;</button>
    </div>
    <div class="panel-body" id="punctuation-panel-body"></div>
  </div>

  <div id="witness-panel" class="side-panel">
    <div class="panel-head">
      <span class="panel-title">Witness disagreement</span>
      <button class="panel-close" id="witness-panel-close">&times;</button>
    </div>
    <div class="panel-body" id="witness-panel-body"></div>
  </div>

  <div id="manual-panel" class="side-panel">
    <div class="panel-head">
      <span class="panel-title">Flag / correct word</span>
      <button class="panel-close" id="manual-panel-close">&times;</button>
    </div>
    <div class="panel-body" id="manual-panel-body"></div>
  </div>

  <script src="/app.js?v=6"></script>
</body>
</html>
